<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Detection - ProofLens AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ultimate-design-system.css') }}">
    <style>
        body {
            padding: 120px 20px 140px;
            min-height: 100vh;
        }
        .tool-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-title {
            font-size: clamp(40px, 6vw, 64px);
            font-weight: 900;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200%;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 16px;
        }
        .page-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }
        .file-drop-zone {
            border: 3px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.02);
        }
        .file-drop-zone:hover {
            background: rgba(102, 126, 234, 0.05);
            border-color: var(--primary);
            transform: scale(1.02);
        }
        .file-drop-zone.dragging {
            background: rgba(102, 126, 234, 0.1);
            border-color: var(--secondary);
            transform: scale(1.05);
        }
        .file-drop-zone i {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .audio-preview {
            margin-top: 20px;
            text-align: center;
        }
        .audio-preview audio {
            width: 100%;
            max-width: 500px;
        }
        #results-section {
            margin-top: 30px;
        }
        .result-card {
            padding: 30px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
        }
        .ai-score {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
        }
        .ai-score.high { color: var(--error); }
        .ai-score.medium { color: var(--warning); }
        .ai-score.low { color: var(--success); }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="ultimate-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Custom Cursor -->
    <div class="ultimate-cursor"></div>
    <div class="ultimate-cursor-follower"></div>

    <!-- Tool Navigation -->
    {% include 'components/tool_nav.html' %}

    <!-- Main Content -->
    <div class="tool-container">
        <div class="page-header" data-aos="fade-up">
            <h1 class="page-title">Audio Detection</h1>
            <p class="page-subtitle">Detect AI-generated or synthetic audio using voice analysis</p>
        </div>

        <div class="ultimate-card" data-aos="fade-up" data-aos-delay="200">
            <form id="audioForm" enctype="multipart/form-data">
                <div class="file-drop-zone" id="dropZone">
                    <i class="fas fa-microphone"></i>
                    <h3>Drag & Drop Audio</h3>
                    <p>or click to browse (MP3, WAV, M4A - Max 50MB)</p>
                    <input type="file" id="audioFile" name="audio" accept="audio/*" required style="display: none;">
                </div>
                <div id="preview" class="audio-preview" style="display: none;"></div>
                <button type="submit" class="ultimate-btn ultimate-btn-primary ultimate-btn-large" style="width: 100%; margin-top: 20px;" id="analyzeBtn" disabled>
                    <i class="fas fa-search"></i> Analyze Audio
                </button>
            </form>
        </div>

        <div id="results-section" style="display: none;" data-aos="fade-up" data-aos-delay="400">
            <div class="result-card">
                <div class="ai-score" id="aiScore">0%</div>
                <div id="analysisDetails" style="margin-top: 20px; color: var(--text-secondary); line-height: 1.8;"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="{{ url_for('static', filename='js/ultimate-interactions.js') }}"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const audioFile = document.getElementById('audioFile');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');

        dropZone.addEventListener('click', () => audioFile.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragging');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragging');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragging');
            const files = e.dataTransfer.files;
            if (files.length) {
                audioFile.files = files;
                showPreview(files[0]);
            }
        });
        
        audioFile.addEventListener('change', (e) => {
            if (e.target.files.length) {
                showPreview(e.target.files[0]);
            }
        });
        
        function showPreview(file) {
            const url = URL.createObjectURL(file);
            preview.innerHTML = `<audio controls><source src="${url}" type="${file.type}"></audio>`;
            preview.style.display = 'block';
            analyzeBtn.disabled = false;
        }

        document.getElementById('audioForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('audio', audioFile.files[0]);
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
            
            try {
                const response = await fetch('/detect_audio', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const score = data.confidence || 0;
                    const scoreEl = document.getElementById('aiScore');
                    scoreEl.textContent = score + '%';
                    scoreEl.className = 'ai-score ' + (data.is_deepfake ? 'high' : 'low');
                    
                    let reasonsHtml = '';
                    if (data.reasons && data.reasons.length > 0) {
                        reasonsHtml = '<ul style="margin: 15px 0 0 20px;">' + 
                            data.reasons.map(r => `<li>${r}</li>`).join('') + '</ul>';
                    }
                    
                    document.getElementById('analysisDetails').innerHTML = 
                        `<p><strong>Status:</strong> ${data.status || (data.is_deepfake ? 'Synthetic Audio Detected' : 'Likely Authentic')}</p>
                         <p><strong>Confidence:</strong> ${score}%</p>
                         <p><strong>Manipulation Type:</strong> ${data.manipulation_type || 'N/A'}</p>
                         ${reasonsHtml}`;
                    document.getElementById('results-section').style.display = 'block';
                    AOS.refresh();
                } else {
                    alert('Error: ' + (data.error || 'Analysis failed. Please login first.'));
                }
            } catch (error) {
                alert('Error analyzing audio. Please make sure you are logged in.');
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = '<i class="fas fa-search"></i> Analyze Audio';
            }
        });
    </script>
</body>
</html>

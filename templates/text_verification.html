<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Verification - ProofLens AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ultimate-design-system.css') }}">
    <style>
        body {
            padding: 120px 20px 140px;
            min-height: 100vh;
        }
        .tool-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-title {
            font-size: clamp(40px, 6vw, 64px);
            font-weight: 900;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200%;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 16px;
        }
        .page-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }
        .ultimate-textarea {
            width: 100%;
            min-height: 200px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .ultimate-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.4);
            background: rgba(255,255,255,0.05);
        }
        #results-section {
            margin-top: 30px;
        }
        .result-card {
            padding: 30px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
        }
        .ai-score {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
        }
        .ai-score.high { color: var(--error); }
        .ai-score.medium { color: var(--warning); }
        .ai-score.low { color: var(--success); }
        .analysis-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .analysis-section h3 {
            color: var(--text-primary);
            margin-bottom: 15px;
            font-size: 20px;
        }
        .analysis-section p, .analysis-section ul {
            color: var(--text-secondary);
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="ultimate-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Custom Cursor -->
    <div class="ultimate-cursor"></div>
    <div class="ultimate-cursor-follower"></div>

    <!-- Tool Navigation -->
    {% include 'components/tool_nav.html' %}

    <!-- Main Content -->
    <div class="tool-container">
        <div class="page-header" data-aos="fade-up">
            <h1 class="page-title">Text Verification</h1>
            <p class="page-subtitle">Analyze text content for AI-generated patterns using advanced NLP models</p>
        </div>

        <div class="ultimate-card" data-aos="fade-up" data-aos-delay="200">
            <form id="textForm" method="POST">
                <textarea id="text" name="text" class="ultimate-textarea" required placeholder="Paste your text here..."></textarea>
                <button type="submit" class="ultimate-btn ultimate-btn-primary ultimate-btn-large" style="width: 100%;">
                    <i class="fas fa-search"></i> Analyze Text
                </button>
            </form>
        </div>

        <div id="results-section" style="display: none;" data-aos="fade-up" data-aos-delay="400">
            <div class="result-card">
                <div class="ai-score" id="aiScore">0%</div>
                <div class="analysis-section" id="analysisDetails"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="{{ url_for('static', filename='js/ultimate-interactions.js') }}"></script>
    <script>
        document.getElementById('textForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = document.getElementById('text').value;
            const button = this.querySelector('button[type="submit"]');
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
            
            try {
                const response = await fetch('/verify_text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const score = data.credibility_score || 50;
                    const scoreEl = document.getElementById('aiScore');
                    scoreEl.textContent = score + '%';
                    // For credibility: high score = good (green), low score = bad (red)
                    scoreEl.className = 'ai-score ' + (score < 40 ? 'high' : score < 70 ? 'medium' : 'low');
                    
                    let claimsHtml = '';
                    if (data.claims && data.claims.length > 0) {
                        claimsHtml = '<ul style="margin-left: 20px;">' + 
                            data.claims.map(c => `<li><strong>${c.claim}</strong>: ${c.assessment} - ${c.explanation}</li>`).join('') +
                            '</ul>';
                    }
                    
                    let redFlagsHtml = '';
                    if (data.red_flags && data.red_flags.length > 0) {
                        redFlagsHtml = '<p style="margin-top: 15px;"><strong>⚠️ Red Flags:</strong></p><ul style="margin-left: 20px;">' +
                            data.red_flags.map(f => `<li>${f}</li>`).join('') + '</ul>';
                    }
                    
                    document.getElementById('analysisDetails').innerHTML = 
                        `<h3>Verdict: ${data.verdict || 'Analysis Complete'}</h3>
                         <p><strong>Summary:</strong> ${data.summary || 'Analysis completed'}</p>
                         ${claimsHtml}
                         ${redFlagsHtml}`;
                    document.getElementById('results-section').style.display = 'block';
                    AOS.refresh();
                } else {
                    alert('Error: ' + (data.error || 'Analysis failed'));
                }
            } catch (error) {
                alert('Error analyzing text. Please make sure you are logged in.');
            } finally {
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-search"></i> Analyze Text';
            }
        });
    </script>
</body>
</html>
